name: Deploy Documentation to GitHub Pages
run-name: "Deploy Documentation to GitHub Pages ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'exercises/**'
      - 'slides/**'
      - '*.md'
      - 'solution/MyHANAApp/README.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'exercises/**'
      - 'slides/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-scan:
    continue-on-error: true   # racecar: scan job other jobs need
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: docs

      - name: Run security audit
        run: npm audit --audit-level=moderate || true
        working-directory: docs

  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          fetch-depth: 0        # required for lastUpdated timestamps
          submodules: true      # required for future external repo content
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**/*.md', 'docs/.vitepress/**') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Install dependencies
        run: npm install

      - name: Build VitePress documentation
        run: npm run docs:build

      - name: Verify build output
        run: |
          test -f .vitepress/dist/index.html || \
            (echo "Build failed: index.html not found in dist/" && exit 1)
          echo "Build verification passed"

      - uses: actions/configure-pages@v4
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist
          retention-days: 1

  deploy:
    continue-on-error: true   # racecar: scan job other jobs need
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
